<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="70%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  
  <!-- Outer Badge Frame -->
  <circle cx="32" cy="32" r="30.5" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#fef3c7" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.7" />

  <!-- Qian (Heaven / Top Yao) -->
  <rect x="23" y="6" width="18" height="2.2" rx="1.1" fill="#fef3c7" opacity="0.95" />
  
  <!-- Center Taiji Emblem -->
  <g transform="translate(32,32) scale(0.68) translate(-32,-32)">
    <!-- Base Circle -->
    <circle cx="32" cy="32" r="24" fill="#fafaf9" stroke="#b45309" stroke-width="1.8" />
    <!-- Yin Half -->
    <path d="M 32 8 A 12 12 0 0 0 32 32 A 12 12 0 0 1 32 56 A 24 24 0 0 1 32 8 Z" fill="#292524" />
    <!-- Yang Eye -->
    <circle cx="32" cy="44" r="3.6" fill="#fafaf9" />
    <!-- Yin Eye -->
    <circle cx="32" cy="20" r="3.6" fill="#292524" />
  </g>

  <!-- Kun (Earth / Bottom Broken Yao) -->
  <rect x="23" y="55.8" width="7.5" height="2.2" rx="1.1" fill="#fef3c7" opacity="0.95" />
  <rect x="33.5" y="55.8" width="7.5" height="2.2" rx="1.1" fill="#fef3c7" opacity="0.95" />
</svg>
